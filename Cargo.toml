[package]
name = "hub_radio"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.3"
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
tokio = {version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = ["fs"] }
rodio = "0.20.1"
yt-dlp = { version = "1.3.3", features = ["tracing"] }
local-ip-address = "0.6.3"
reqwest = "0.12.15"
scraper = "0.23.1"
qrcode = "0.14.1"
image = "0.25.6"

[profile.release]
opt-level = 1